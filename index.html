<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hexi — Minecraft Mods</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <!-- ===================== HERO ===================== -->
  <header class="hero">
    <p class="eyebrow">Minecraft mods by</p>
    <h1 class="logo">HEXI</h1>
    <p class="tagline">Client-side Fabric mods that change how Minecraft looks and feels.</p>
    <a class="button" href="https://modrinth.com/user/Hexi" target="_blank" rel="noopener">View all on Modrinth</a>
  </header>

  <!-- ===================== MODS =====================
       This list fills itself automatically from your
       Modrinth account. You don't edit anything here. -->
  <main class="mods" id="mods">
    <p class="status" id="status">Loading mods from Modrinth…</p>
  </main>

  <!-- ===================== SUPPORT MESSAGE ===================== -->
  <section class="support">
    <p>Every download and view helps Hexi keep making mods — thank you for the support! 💙</p>
  </section>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <p class="views" id="views">👁 … views</p>
    <p>Made by Hexi · <span id="year"></span></p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
